# Checks every pull request and every push to main: `npm ci`, `npm run build`, then `npm run check` (typecheck plus the
# unit tests). Some tests read what the build wrote (`dist/server/`, the editors, the Shell, the frame-host), so the
# build comes first.
#
# Node 24, the same as the release workflows. End-to-end tests (`npm run e2e`) need Chrome and are not run here.
name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  # A new push to a pull request replaces its older run; every commit on main is checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run check
