<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Whiteboard host</title></head>
<body style="margin:0"><iframe title="Board" style="width:100vw;height:98vh;border:0"></iframe><script>
  window.reports = [];
  const frame = document.querySelector('iframe');
  addEventListener('message', event => {
    if (event.source === frame.contentWindow && event.origin === location.origin && event.data.openArtifact === 'chrome_report')
      reports.push(event.data.report);
  });
  frame.src = './?open_artifact_shell=' + encodeURIComponent(location.origin);
</script></body></html>
