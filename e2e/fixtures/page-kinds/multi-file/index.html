<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit converter</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<main>
  <img id="logo" src="images/logo.svg" alt="" width="32" height="32">
  <h1>Unit converter</h1>
  <label>Kilometres <input id="km" type="number" value="5"></label>
  <p>= <output id="miles">…</output> miles</p>
  <ul id="presets"></ul>
  <p id="status">Loading…</p>
</main>
</body>
</html>
