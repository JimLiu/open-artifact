<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Switch</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: var(--space-5); background: var(--surface); color: var(--ink); font: var(--text-body); -webkit-font-smoothing: antialiased; }
  .list { max-width: 440px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface-raised); }
  .list > * + * { border-top: 1px solid var(--line); }

  .jp-switch { display: flex; align-items: center; gap: var(--space-4); min-height: 44px; padding: var(--space-3) var(--space-4); cursor: pointer; }
  .jp-switch__text { flex: 1; min-width: 0; }
  .jp-switch__label { display: block; font: var(--text-label); font-size: 15px; }
  .jp-switch__hint { display: block; font: var(--text-caption); color: var(--ink-muted); }
  .jp-switch input { position: absolute; opacity: 0; pointer-events: none; }
  .jp-switch__track { position: relative; flex: none; width: 44px; height: 26px; border: 1px solid var(--line-strong); border-radius: var(--radius-pill); background: var(--surface-sunken); transition: background var(--duration-base) var(--ease-settle), border-color var(--duration-base) var(--ease-settle); }
  .jp-switch__track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: var(--radius-pill); background: var(--line-strong); box-shadow: var(--shadow-sm); transition: transform var(--duration-base) var(--ease-settle), background var(--duration-base) var(--ease-settle); }
  .jp-switch input:checked + .jp-switch__track { border-color: var(--forest); background: var(--forest); }
  .jp-switch input:checked + .jp-switch__track::after { transform: translateX(18px); background: var(--on-forest); }
  .jp-switch input:focus-visible + .jp-switch__track { outline: 2px solid var(--accent-focus); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .jp-switch__track, .jp-switch__track::after { transition: none; } }
</style>
</head>
<body>
<div class="list">
  <label class="jp-switch">
    <span class="jp-switch__text">
      <span class="jp-switch__label">Grind for my brewer</span>
      <span class="jp-switch__hint">Ground on roast day, for a pour-over.</span>
    </span>
    <input type="checkbox" checked>
    <span class="jp-switch__track"></span>
  </label>
  <label class="jp-switch">
    <span class="jp-switch__text">
      <span class="jp-switch__label">Pause deliveries</span>
      <span class="jp-switch__hint">Your plan stays; nothing ships until you turn this off.</span>
    </span>
    <input type="checkbox">
    <span class="jp-switch__track"></span>
  </label>
</div>
</body>
</html>
