<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RoastCard</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: var(--space-5); background: var(--surface); color: var(--ink); font: var(--text-body); -webkit-font-smoothing: antialiased; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--space-5); }

  .jp-roast { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: var(--space-4); padding: var(--space-4); border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface-raised); }
  .jp-roast__label { position: relative; overflow: hidden; min-height: 168px; border-radius: var(--radius-md); background: var(--honey-soft); }
  .jp-roast__label i { position: absolute; display: block; }
  .jp-roast__sun { left: 50%; bottom: 44px; width: 64px; height: 64px; margin-left: -32px; border-radius: var(--radius-pill); background: var(--honey); }
  .jp-roast__hill { left: -20%; right: -20%; bottom: -46px; height: 110px; border-radius: 50%; background: var(--forest); }
  .jp-roast--dark .jp-roast__label { background: var(--forest); }
  .jp-roast--dark .jp-roast__sun { bottom: 34px; width: 36px; height: 36px; margin-left: -18px; background: var(--honey); }
  .jp-roast--dark .jp-roast__hill { background: var(--moss); bottom: -64px; }
  .jp-roast__body { display: flex; flex-direction: column; min-width: 0; }
  .jp-roast__top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-2); }
  .jp-roast__kicker { margin: 0; color: var(--ink-muted); }
  .jp-roast__name { margin: 2px 0 var(--space-1); }
  .jp-roast__notes { margin: 0; font: var(--text-caption); font-size: 14px; line-height: 20px; color: var(--ink-muted); }
  .jp-roast__meter { display: flex; align-items: center; gap: 5px; margin: var(--space-3) 0 0; font: var(--text-caption); color: var(--ink-muted); }
  .jp-roast__meter i { width: 10px; height: 10px; border-radius: var(--radius-pill); background: var(--moss-soft); }
  .jp-roast__meter i.is-on { background: var(--moss); }
  .jp-roast__meter span { margin-left: var(--space-1); }
  .jp-roast__foot { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-top: auto; padding-top: var(--space-3); }
  .jp-roast__price { white-space: nowrap; }

  .jp-tag { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 var(--space-2); border-radius: var(--radius-sm); font: var(--text-label); font-size: 12px; white-space: nowrap; }
  .jp-tag::before { content: ""; width: 6px; height: 6px; border-radius: var(--radius-pill); background: currentColor; }
  .jp-tag--new { background: var(--accent-soft); color: var(--accent-strong); }
  .jp-tag--success { background: var(--forest-soft); color: var(--text-success); }
  .jp-btn { display: inline-flex; align-items: center; height: 36px; padding: 0 var(--space-4); border: 1px solid transparent; border-radius: var(--radius-md); font: var(--text-label); white-space: nowrap; cursor: pointer; }
  .jp-btn--primary { background: var(--accent); color: var(--on-accent); }
  .jp-btn--primary:hover { background: var(--accent-strong); }
  .jp-btn--secondary { background: var(--surface-raised); border-color: var(--line-strong); color: var(--ink); }
  .jp-btn:focus-visible { outline: 2px solid var(--accent-focus); outline-offset: 2px; }
</style>
</head>
<body>
<div class="row">
  <article class="jp-roast">
    <div class="jp-roast__label" aria-hidden="true"><i class="jp-roast__sun"></i><i class="jp-roast__hill"></i></div>
    <div class="jp-roast__body">
      <div class="jp-roast__top">
        <p class="jp-roast__kicker overline">Spring blend</p>
        <span class="jp-tag jp-tag--new">New roast</span>
      </div>
      <h3 class="jp-roast__name title">First Light</h3>
      <p class="jp-roast__notes">Apricot, jasmine and a little honey.</p>
      <p class="jp-roast__meter" aria-label="Roast: light, 2 of 5"><i class="is-on"></i><i class="is-on"></i><i></i><i></i><i></i><span>Light roast</span></p>
      <div class="jp-roast__foot">
        <span class="jp-roast__price data">$18.00 · 250 g</span>
        <button class="jp-btn jp-btn--primary" type="button">Add to bag</button>
      </div>
    </div>
  </article>
  <article class="jp-roast jp-roast--dark">
    <div class="jp-roast__label" aria-hidden="true"><i class="jp-roast__sun"></i><i class="jp-roast__hill"></i></div>
    <div class="jp-roast__body">
      <div class="jp-roast__top">
        <p class="jp-roast__kicker overline">Year round</p>
        <span class="jp-tag jp-tag--success">In stock</span>
      </div>
      <h3 class="jp-roast__name title">Hearth</h3>
      <p class="jp-roast__notes">Cocoa, toasted walnut, molasses.</p>
      <p class="jp-roast__meter" aria-label="Roast: dark, 4 of 5"><i class="is-on"></i><i class="is-on"></i><i class="is-on"></i><i class="is-on"></i><i></i><span>Dark roast</span></p>
      <div class="jp-roast__foot">
        <span class="jp-roast__price data">$16.00 · 250 g</span>
        <button class="jp-btn jp-btn--secondary" type="button">Add to bag</button>
      </div>
    </div>
  </article>
</div>
</body>
</html>
